name: Build & Release Launcher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:   # Permet le lancement manuel direct depuis l'onglet Actions

permissions:
  contents: write   # Nécessaire pour créer la release et téléverser les fichiers sur GitHub

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24   # Mis à jour pour éviter les erreurs Node 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject secrets
        shell: bash
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -n "$DISCORD_WEBHOOK" ]; then
            printf '{ "discordWebhook": "%s" }' "$DISCORD_WEBHOOK" > src/main/secrets.json
            echo "secrets.json injecté"
          else
            echo "Pas de secret DISCORD_WEBHOOK — partage de captures désactivé dans ce build"
          fi

      # MODIFIÉ : On ajoute "-- --publish always" pour forcer l'envoi vers l'onglet Releases
      - name: Build & publish (electron-builder -> GitHub Releases)
        run: npm run publish -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # AJOUTÉ : Ce bloc force GitHub à sauvegarder les fichiers dans l'onglet Actions (Artifacts)
      - name: Sauvegarder les exécutables (Artifacts Actions)
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: warn
